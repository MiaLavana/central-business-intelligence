<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central Business Intelligence</title>
  <meta name="description" content="Apple-clean education map with interactive pins." />

  <style>
    :root{
      --bg:#ffffff;
      --text:#0b0b0f;
      --muted: rgba(11,11,15,.62);
      --hair: rgba(11,11,15,.10);
      --shadow: 0 28px 90px rgba(0,0,0,.14);
      --ease: cubic-bezier(.22,.61,.36,1);
      --radius: 28px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overflow-x:hidden;
    }

    /* ======= Apple-clean layout ======= */
    .nav{
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(11,11,15,.06);
    }
    .navInner{
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .dot{
      width:10px; height:10px;
      border-radius:999px;
      background: rgba(11,11,15,.85);
      display:inline-block;
    }
    .navRight{
      display:flex;
      gap: 10px;
      align-items:center;
      color: rgba(11,11,15,.55);
      font-size: 13px;
      white-space: nowrap;
    }

    /* Toggle button (Apple-clean) */
    .btn{
      border: 1px solid rgba(11,11,15,.12);
      background: rgba(11,11,15,.04);
      padding: 9px 12px;
      border-radius: 999px;
      font-weight: 650;
      font-size: 13px;
      cursor: pointer;
      transition: transform .18s var(--ease), background .18s var(--ease);
      user-select:none;
    }
    .btn:hover{ background: rgba(11,11,15,.06); }
    .btn:active{ transform: scale(.98); }

    /* ======= HERO ======= */
    .hero{
      padding: 64px 0 34px;
      background:
        radial-gradient(1100px 520px at 50% -10%, rgba(11,11,15,.06), transparent 58%),
        radial-gradient(900px 420px at 10% 10%, rgba(11,11,15,.03), transparent 55%),
        #fff;
    }

    .heroCopy{
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 18px 22px;
    }

    .eyebrow{
      margin:0 0 10px;
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(11,11,15,.55);
    }

    h1{
      margin:0;
      font-size: clamp(40px, 6vw, 84px);
      letter-spacing: -0.04em;
      line-height: 0.98;
    }

    .sub{
      margin: 14px 0 0;
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted);
      max-width: 74ch;
    }

    .hintRow{
      margin-top: 16px;
      display:flex;
      align-items:center;
      gap: 12px;
      flex-wrap: wrap;
      color: rgba(11,11,15,.55);
      font-size: 13px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(11,11,15,.10);
      background: rgba(11,11,15,.03);
      user-select:none;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid rgba(11,11,15,.14);
      background: rgba(255,255,255,.75);
      color: rgba(11,11,15,.72);
    }

    /* ======= FULL BLEED MAP (WOW) ======= */
    .bleed{
      width: 100vw;
      margin-left: 50%;
      transform: translateX(-50%);
      padding: 0;
    }

    .map{
      position: relative;
      width: 100%;
      aspect-ratio: 21 / 9; /* wide + cinematic */
      background: #fff url("assets/banner-map.png") center / contain no-repeat;
      border-top: 1px solid rgba(11,11,15,.06);
      border-bottom: 1px solid rgba(11,11,15,.06);
      transform: translateZ(0);
    }

    /* Taller on small screens so it still feels like a hero */
    @media (max-width: 860px){
      .hero{ padding-top: 46px; }
      .map{ aspect-ratio: 4 / 5; }
    }

    /* Subtle Apple motion: gentle parallax on hover devices */
    @media (hover:hover){
      .map{
        will-change: transform;
        transition: transform .22s var(--ease);
      }
    }

    /* ======= PINS ======= */
    .pin{
      position:absolute;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: rgba(11,11,15,.92);
      border: 2px solid rgba(255,255,255,.98);
      transform: translate(-50%, -50%);
      cursor:pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,.18);
      outline:none;
    }
    .pin::after{
      content:"";
      position:absolute;
      inset: -10px;
      border-radius: 999px;
      border: 1px solid rgba(11,11,15,.18);
      transform: scale(.55);
      opacity:0;
      animation: pulse 2.2s var(--ease) infinite;
    }
    .pin:hover{ transform: translate(-50%,-50%) scale(1.06); }
    .pin:focus-visible{
      box-shadow: 0 0 0 4px rgba(11,11,15,.14), 0 10px 22px rgba(0,0,0,.18);
    }

    /* tiny stagger (premium rhythm) */
    .pin[data-i="2"]::after{ animation-delay: .25s; }
    .pin[data-i="3"]::after{ animation-delay: .5s; }
    .pin[data-i="4"]::after{ animation-delay: .75s; }
    .pin[data-i="5"]::after{ animation-delay: 1s; }

    @keyframes pulse{
      0%{ transform: scale(.55); opacity:0; }
      18%{ opacity:.85; }
      55%{ opacity:.25; }
      100%{ transform: scale(1.65); opacity:0; }
    }

    /* Picker readout (hidden unless picker enabled) */
    .readout{
      position:absolute;
      right: 14px;
      bottom: 12px;
      font-size: 12px;
      color: rgba(11,11,15,.62);
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(11,11,15,.10);
      padding: 6px 8px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      pointer-events:none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .18s var(--ease), transform .18s var(--ease);
    }
    .readout.show{
      opacity: 1;
      transform: translateY(0);
    }

    /* ======= MODAL (Apple sheet) ======= */
    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.42);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 60;
    }
    .modalBack.isOpen{ display:flex; }

    .modal{
      width: min(880px, 100%);
      border-radius: 30px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.20);
      box-shadow: 0 40px 140px rgba(0,0,0,.34);
      overflow:hidden;
      transform: translateY(10px);
      opacity: 0;
      transition: transform .22s var(--ease), opacity .22s var(--ease);
      backdrop-filter: blur(18px);
    }
    .modalBack.isOpen .modal{ transform: translateY(0); opacity: 1; }

    .modalTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid rgba(11,11,15,.10);
    }
    .modalTop strong{
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(11,11,15,.55);
    }
    .close{
      border: 0;
      background: rgba(11,11,15,.06);
      border-radius: 999px;
      width: 42px;
      height: 42px;
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .18s var(--ease), background .18s var(--ease);
    }
    .close:hover{ background: rgba(11,11,15,.08); }
    .close:active{ transform: scale(.98); }

    .modalBody{
      padding: 16px 16px 18px;
      display:grid;
      gap: 14px;
    }
    .logoWrap{
      display:flex;
      justify-content:center;
      align-items:center;
      padding: 22px 18px;
      background: rgba(11,11,15,.02);
      border-radius: 18px;
      border: 1px solid rgba(11,11,15,.08);
    }
    .logoWrap img{
      max-height: 72px;
      max-width: 260px;
      object-fit: contain;
      filter: saturate(.95);
    }
    .meta{
      text-align:center;
    }
    .meta h2{
      margin:0;
      font-size: 22px;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .meta p{
      margin: 8px 0 0;
      color: rgba(11,11,15,.65);
      font-size: 14px;
      line-height: 1.45;
    }

    /* Toast */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(11,11,15,.86);
      color: #fff;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events:none;
      z-index: 80;
    }
    .toast.show{ opacity: 1; }

    /* Footer (quiet) */
    .footer{
      max-width: 1200px;
      margin: 0 auto;
      padding: 22px 18px 44px;
      color: rgba(11,11,15,.55);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="nav">
    <div class="navInner">
      <div class="brand"><span class="dot"></span> Central Business Intelligence</div>

      <!-- ✅ NEW: visible toggle (no keyboard needed) -->
      <div class="navRight">
        <button class="btn" id="pickerBtn" type="button">Pin Picker: Off</button>
      </div>
    </div>
  </div>

  <main class="hero">
    <section class="heroCopy">
      <p class="eyebrow">Education Map</p>
      <h1>Places that shaped my path.</h1>
      <p class="sub">
        A clean, minimal global view. Tap a pin to open details.
      </p>

      <div class="hintRow">
        <span class="chip">Interactive pins • modal details • Apple-clean</span>
        <span class="chip">Pin Picker is now a button in the top bar</span>
      </div>
    </section>

    <section class="bleed">
      <div class="map" id="map" aria-label="World map with location pins">
        <!-- California -->
        <button class="pin" data-i="1"
          data-label="California"
          data-logo="assets/logos/UCR.png"
          data-caption="UCR School of Business • A. Gary Anderson Graduate School of Management"
          style="left:18.7%; top:48.8%"></button>

        <!-- NYC -->
        <button class="pin" data-i="2"
          data-label="New York City"
          data-logo="assets/logos/NYU.png"
          data-caption="NYU Tandon School of Engineering"
          style="left:24.4%; top:42.0%"></button>

        <!-- Cambridge (Harvard) -->
        <button class="pin" data-i="3"
          data-label="Cambridge"
          data-logo="assets/logos/HBR.png"
          data-caption="Harvard Business Review"
          style="left:24.2%; top:41.5%"></button>

        <!-- Yale -->
        <button class="pin" data-i="4"
          data-label="New Haven"
          data-logo="assets/logos/Yale.png"
          data-caption="Yale University"
          style="left:24.0%; top:42.3%"></button>

        <!-- Duke -->
        <button class="pin" data-i="5"
          data-label="Durham"
          data-logo="assets/logos/Duke.png"
          data-caption="Duke University"
          style="left:23.0%; top:46.2%"></button>

        <!-- Johns Hopkins -->
        <button class="pin" data-i="1"
          data-label="Baltimore"
          data-logo="assets/logos/Johns-Hopkins.png"
          data-caption="Johns Hopkins University"
          style="left:23.6%; top:44.7%"></button>

        <!-- Italy (Bocconi) -->
        <button class="pin" data-i="2"
          data-label="Milan"
          data-logo="assets/logos/Bocconi.png"
          data-caption="SDA Bocconi School of Management"
          style="left:55.8%; top:40.7%"></button>

        <!-- Hong Kong -->
        <button class="pin" data-i="3"
          data-label="Hong Kong"
          data-logo="assets/logos/Hong-Kong.png"
          data-caption="The Hong Kong University of Science and Technology"
          style="left:78.8%; top:50.0%"></button>

        <div class="readout" id="readout" aria-hidden="true"></div>
      </div>
    </section>

    <div class="footer">
      Seamless white. Full-bleed hero. Tiles next.
    </div>
  </main>

  <!-- Modal -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true" aria-label="Location details">
    <div class="modal">
      <div class="modalTop">
        <strong>Details</strong>
        <button class="close" id="closeBtn" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(11,11,15,.75)" stroke-width="2.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <div class="modalBody">
        <div class="logoWrap">
          <img id="modalLogo" src="" alt="">
        </div>
        <div class="meta">
          <h2 id="modalTitle">Location</h2>
          <p id="modalCaption"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied</div>

  <script>
    const map = document.getElementById('map');
    const readout = document.getElementById('readout');
    const toast = document.getElementById('toast');
    const pickerBtn = document.getElementById('pickerBtn');

    const modalBack = document.getElementById('modalBack');
    const modalLogo = document.getElementById('modalLogo');
    const modalTitle = document.getElementById('modalTitle');
    const modalCaption = document.getElementById('modalCaption');
    const closeBtn = document.getElementById('closeBtn');

    let picking = false;

    function showToast(text){
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(()=> toast.classList.remove('show'), 900);
    }

    function updatePickerUI(){
      pickerBtn.textContent = `Pin Picker: ${picking ? 'On' : 'Off'}`;
      if(!picking) readout.classList.remove('show');
    }

    pickerBtn.addEventListener('click', ()=>{
      picking = !picking;
      updatePickerUI();
      showToast(picking ? 'Pin Picker On' : 'Pin Picker Off');
    });

    function percentsFromEvent(e){
      const r = map.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width * 100);
      const y = ((e.clientY - r.top) / r.height * 100);
      return { x, y };
    }

    // Live readout only when picking
    map.addEventListener('mousemove', (e)=>{
      if (!picking) return;
      const { x, y } = percentsFromEvent(e);
      readout.textContent = `${x.toFixed(1)}% , ${y.toFixed(1)}%`;
      readout.classList.add('show');
    });

    map.addEventListener('mouseleave', ()=>{
      if (!picking) return;
      readout.classList.remove('show');
    });

    // Subtle parallax (hover devices)
    if (matchMedia('(hover:hover)').matches){
      map.addEventListener('mousemove', (e)=>{
        const r = map.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - 0.5;
        const py = (e.clientY - r.top) / r.height - 0.5;
        map.style.transform = `scale(1.008) translate(${px * 6}px, ${py * 6}px)`;
      });
      map.addEventListener('mouseleave', ()=>{
        map.style.transform = '';
      });
    }

    // Map click -> copy snippet when picking
    map.addEventListener('click', async (e)=>{
      if (!picking) return;
      const { x, y } = percentsFromEvent(e);
      const left = x.toFixed(1);
      const top  = y.toFixed(1);
      const snippet = `style="left:${left}%; top:${top}%"`;
      try{
        await navigator.clipboard.writeText(snippet);
        showToast(`Copied: ${snippet}`);
      }catch{
        showToast(`Pin: ${left}% , ${top}%`);
      }
    });

    // Pins -> modal (when not picking)
    document.querySelectorAll('.pin').forEach(pin=>{
      pin.addEventListener('click', (e)=>{
        e.stopPropagation();
        if (picking) return;

        modalTitle.textContent = pin.dataset.label || 'Location';
        modalCaption.textContent = pin.dataset.caption || '';
        modalLogo.src = pin.dataset.logo || '';
        modalLogo.alt = pin.dataset.label || 'Logo';

        modalBack.classList.add('isOpen');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeModal(){
      modalBack.classList.remove('isOpen');
      document.body.style.overflow = '';
      modalLogo.src = '';
    }
    closeBtn.addEventListener('click', closeModal);
    modalBack.addEventListener('click', (e)=>{ if (e.target === modalBack) closeModal(); });

    // Keep keyboard Escape support
    window.addEventListener('keydown', (e)=>{
      if (e.key === 'Escape' && modalBack.classList.contains('isOpen')){
        closeModal();
      }
    });

    updatePickerUI();
  </script>
</body>
</html>
