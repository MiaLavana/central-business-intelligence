<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central Business Intelligence</title>
  <meta name="description" content="Education map with interactive pins and a logo-first modal." />

  <style>
    :root{
      --bg:#ffffff;
      --text:#0b0b0f;
      --muted: rgba(11,11,15,.62);
      --ease: cubic-bezier(.22,.61,.36,1);
      --hair: rgba(11,11,15,.06);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overflow-x:hidden;
    }

    /* ======= Minimal top bar ======= */
    .nav{
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--hair);
    }
    .navInner{
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    .dot{
      width:10px; height:10px;
      border-radius:999px;
      background: rgba(11,11,15,.85);
      display:inline-block;
    }

    .navRight{
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap: wrap;
    }

    .btn{
      border: 1px solid rgba(11,11,15,.12);
      background: rgba(11,11,15,.04);
      padding: 9px 12px;
      border-radius: 999px;
      font-weight: 650;
      font-size: 13px;
      cursor: pointer;
      transition: transform .18s var(--ease), background .18s var(--ease);
      user-select:none;
      white-space: nowrap;
    }
    .btn:hover{ background: rgba(11,11,15,.06); }
    .btn:active{ transform: scale(.98); }
    .btn:disabled{
      opacity:.45;
      cursor: default;
    }

    /* ======= HERO ======= */
    .hero{
      padding: 64px 0 34px;
      background:
        radial-gradient(1100px 520px at 50% -10%, rgba(11,11,15,.06), transparent 58%),
        radial-gradient(900px 420px at 10% 10%, rgba(11,11,15,.03), transparent 55%),
        #fff;
    }
    .heroCopy{
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 18px 22px;
    }
    .eyebrow{
      margin:0 0 10px;
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(11,11,15,.55);
    }
    h1{
      margin:0;
      font-size: clamp(40px, 6vw, 84px);
      letter-spacing: -0.04em;
      line-height: 0.98;
    }
    .sub{
      margin: 14px 0 0;
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted);
      max-width: 74ch;
    }

    /* ======= FULL BLEED MAP ======= */
    .bleed{
      width: 100vw;
      margin-left: 50%;
      transform: translateX(-50%);
      padding: 0;
    }
    .map{
      position: relative;
      width: 100%;
      aspect-ratio: 21 / 9;
      background: #fff url("assets/banner-map.png") center / contain no-repeat;
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      transform: translateZ(0);
      touch-action: manipulation;
    }
    @media (max-width: 860px){
      .hero{ padding-top: 46px; }
      .map{ aspect-ratio: 4 / 5; }
    }

    /* Subtle Apple motion: gentle parallax on hover devices */
    @media (hover:hover){
      .map{
        will-change: transform;
        transition: transform .22s var(--ease);
      }
    }

    /* ======= PINS ======= */
    .pin{
      position:absolute;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: rgba(11,11,15,.92);
      border: 2px solid rgba(255,255,255,.98);
      cursor:pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,.18);
      outline:none;

      --scale: 1;
      transform: translate(-50%, -50%) scale(var(--scale));
      transition: transform .18s var(--ease), box-shadow .18s var(--ease);
      z-index: 2;
    }

    /* Bigger invisible hit area */
    .pin::before{
      content:"";
      position:absolute;
      inset:-18px;
      border-radius:999px;
    }

    .pin::after{
      content:"";
      position:absolute;
      inset: -10px;
      border-radius: 999px;
      border: 1px solid rgba(11,11,15,.18);
      transform: scale(.55);
      opacity:0;
      animation: pulse 2.2s var(--ease) infinite;
      pointer-events:none;
    }

    .pin[data-i="2"]::after{ animation-delay: .25s; }
    .pin[data-i="3"]::after{ animation-delay: .5s; }
    .pin[data-i="4"]::after{ animation-delay: .75s; }
    .pin[data-i="5"]::after{ animation-delay: 1s; }

    @keyframes pulse{
      0%{ transform: scale(.55); opacity:0; }
      18%{ opacity:.85; }
      55%{ opacity:.25; }
      100%{ transform: scale(1.65); opacity:0; }
    }

    /* Proximity states */
    .pin.isNear{
      --scale: 1.55;
      z-index: 10;
      box-shadow: 0 14px 34px rgba(0,0,0,.24);
    }
    .pin.isClosest{
      --scale: 1.95;
      z-index: 20;
      box-shadow: 0 18px 44px rgba(0,0,0,.28);
    }

    /* Picker readout */
    .readout{
      position:absolute;
      right: 14px;
      bottom: 12px;
      font-size: 12px;
      color: rgba(11,11,15,.62);
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(11,11,15,.10);
      padding: 6px 8px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      pointer-events:none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .18s var(--ease), transform .18s var(--ease);
    }
    .readout.show{
      opacity: 1;
      transform: translateY(0);
    }

    /* ======= MODAL (logo-first) ======= */
    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.42);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 60;
    }
    .modalBack.isOpen{ display:flex; }

    .modal{
      width: min(900px, 100%);
      border-radius: 30px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.20);
      box-shadow: 0 40px 140px rgba(0,0,0,.34);
      overflow:hidden;
      transform: translateY(10px);
      opacity: 0;
      transition: transform .22s var(--ease), opacity .22s var(--ease);
      backdrop-filter: blur(18px);
    }
    .modalBack.isOpen .modal{ transform: translateY(0); opacity: 1; }

    .modalTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid rgba(11,11,15,.10);
    }
    .modalTop strong{
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(11,11,15,.55);
    }
    .close{
      border: 0;
      background: rgba(11,11,15,.06);
      border-radius: 999px;
      width: 42px;
      height: 42px;
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .18s var(--ease), background .18s var(--ease);
    }
    .close:hover{ background: rgba(11,11,15,.08); }
    .close:active{ transform: scale(.98); }

    .modalBody{
      padding: 32px 32px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .logoHero{
      width: 100%;
      height: 300px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg, rgba(11,11,15,.04), rgba(11,11,15,.01));
      border-radius: 26px;
    }
    .logoHero img{
      max-width: 620px;
      max-height: 210px;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0;
      transform: scale(.96);
      transition: opacity .35s ease, transform .35s ease;
    }
    .modalBack.isOpen .logoHero img{
      opacity: 1;
      transform: scale(1);
    }

    .meta{
      text-align:center;
      margin-top: 2px;
    }
    .meta h2{
      margin:0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .meta p{
      margin: 8px 0 0;
      color: rgba(11,11,15,.58);
      font-size: 14px;
      line-height: 1.45;
      max-width: 72ch;
    }

    /* Toast */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(11,11,15,.86);
      color: #fff;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events:none;
      z-index: 80;
    }
    .toast.show{ opacity: 1; }

    .footer{
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 18px 44px;
      color: rgba(11,11,15,.50);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="nav">
    <div class="navInner">
      <div class="brand"><span class="dot"></span> Central Business Intelligence</div>

      <!-- ✅ Pin picker controls -->
      <div class="navRight">
        <button class="btn" id="pickerBtn" type="button">Pin Picker: Off</button>
        <button class="btn" id="modeBtn" type="button" disabled>Mode: Mobile</button>
      </div>
    </div>
  </div>

  <main class="hero">
    <section class="heroCopy">
      <p class="eyebrow">Education Map</p>
      <h1>Places that shaped my path.</h1>
      <p class="sub">Tap a pin to open details.</p>
    </section>

    <section class="bleed">
      <div class="map" id="map" aria-label="World map with location pins">

        <!-- Pins now store BOTH sets: desktop (d) and mobile (m).
             JS applies the correct set automatically based on screen width. -->

        <button class="pin" data-i="1"
          data-label="California"
          data-logo="assets/logos/UCR.png"
          data-caption="UCR School of Business • A. Gary Anderson Graduate School of Management"
          data-d-left="36.4" data-d-top="30.4"
          data-m-left="31.8" data-m-top="41.0"></button>

        <button class="pin" data-i="2"
          data-label="Milan"
          data-logo="assets/logos/Bocconi.png"
          data-caption="SDA Bocconi School of Management"
          data-d-left="49.6" data-d-top="28.1"
          data-m-left="49.3" data-m-top="39.8"></button>

        <button class="pin" data-i="3"
          data-label="Durham"
          data-logo="assets/logos/Duke.png"
          data-caption="Duke University"
          data-d-left="40.1" data-d-top="29.5"
          data-m-left="37.1" data-m-top="40.8"></button>

        <button class="pin" data-i="4"
          data-label="Cambridge"
          data-logo="assets/logos/HBR.png"
          data-caption="Harvard Business Review"
          data-d-left="40.9" data-d-top="27.9"
          data-m-left="39.1" data-m-top="39.8"></button>

        <button class="pin" data-i="5"
          data-label="Hong Kong"
          data-logo="assets/logos/Hong-Kong.png"
          data-caption="The Hong Kong University of Science and Technology"
          data-d-left="59.8" data-d-top="32.8"
          data-m-left="63.4" data-m-top="41.6"></button>

        <button class="pin" data-i="2"
          data-label="New York City"
          data-logo="assets/logos/NYU.png"
          data-caption="NYU Tandon School of Engineering"
          data-d-left="40.7" data-d-top="28.1"
          data-m-left="38.1" data-m-top="40.2"></button>

        <button class="pin" data-i="3"
          data-label="New Haven"
          data-logo="assets/logos/Yale.png"
          data-caption="Yale University"
          data-d-left="41.3" data-d-top="28.1"
          data-m-left="37.6" data-m-top="40.2"></button>

        <div class="readout" id="readout" aria-hidden="true"></div>
      </div>
    </section>

    <div class="footer">
      Seamless white. Full-bleed hero.
    </div>
  </main>

  <!-- Modal -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true" aria-label="Location details">
    <div class="modal">
      <div class="modalTop">
        <strong>Details</strong>
        <button class="close" id="closeBtn" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(11,11,15,.75)" stroke-width="2.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <div class="modalBody">
        <div class="logoHero">
          <img id="modalLogo" src="" alt="">
        </div>
        <div class="meta">
          <h2 id="modalTitle"></h2>
          <p id="modalCaption"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied</div>

  <script>
    const map = document.getElementById('map');
    const pins = Array.from(document.querySelectorAll('.pin'));

    const modalBack = document.getElementById('modalBack');
    const modalLogo = document.getElementById('modalLogo');
    const modalTitle = document.getElementById('modalTitle');
    const modalCaption = document.getElementById('modalCaption');
    const closeBtn = document.getElementById('closeBtn');

    const readout = document.getElementById('readout');
    const toast = document.getElementById('toast');

    const pickerBtn = document.getElementById('pickerBtn');
    const modeBtn = document.getElementById('modeBtn');

    const mqMobile = matchMedia('(max-width: 860px)');
    let picking = false;
    let pickerMode = 'mobile'; // default since you're finding mobile coords

    function showToast(text){
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(()=> toast.classList.remove('show'), 900);
    }

    function applyPinPositions(){
      const useMobile = mqMobile.matches;
      pins.forEach(p=>{
        const dL = p.dataset.dLeft, dT = p.dataset.dTop;
        const mL = p.dataset.mLeft, mT = p.dataset.mTop;
        const left = useMobile ? (mL || dL) : dL;
        const top  = useMobile ? (mT || dT) : dT;
        p.style.left = `${left}%`;
        p.style.top  = `${top}%`;
      });
    }
    applyPinPositions();
    mqMobile.addEventListener?.('change', applyPinPositions);
    window.addEventListener('resize', applyPinPositions);

    // Subtle parallax (hover devices)
    if (matchMedia('(hover:hover)').matches){
      map.addEventListener('mousemove', (e)=>{
        const r = map.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - 0.5;
        const py = (e.clientY - r.top) / r.height - 0.5;
        map.style.transform = `scale(1.008) translate(${px * 6}px, ${py * 6}px)`;
      });
      map.addEventListener('mouseleave', ()=>{ map.style.transform = ''; });
    }

    function openFromPin(pin){
      modalTitle.textContent = pin.dataset.label || 'Location';
      modalCaption.textContent = pin.dataset.caption || '';
      modalLogo.src = pin.dataset.logo || '';
      modalLogo.alt = pin.dataset.label || 'Logo';
      modalBack.classList.add('isOpen');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(){
      modalBack.classList.remove('isOpen');
      document.body.style.overflow = '';
      modalLogo.src = '';
    }
    closeBtn.addEventListener('click', closeModal);
    modalBack.addEventListener('click', (e)=>{ if (e.target === modalBack) closeModal(); });
    window.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeModal(); });

    // Proximity helper (clickability)
    function setProximity(clientX, clientY){
      pins.forEach(p => p.classList.remove('isNear','isClosest'));

      const dists = pins.map(p=>{
        const r = p.getBoundingClientRect();
        const cx = r.left + r.width/2;
        const cy = r.top + r.height/2;
        return { p, d: Math.hypot(clientX - cx, clientY - cy) };
      }).sort((a,b)=>a.d-b.d);

      const nearRadius = 56;
      const closestRadius = 34;

      if (!dists[0] || dists[0].d > nearRadius) return;

      if (dists[0].d <= closestRadius) dists[0].p.classList.add('isClosest');
      else dists[0].p.classList.add('isNear');

      for (let i=1; i<Math.min(dists.length, 5); i++){
        if (dists[i].d <= nearRadius) dists[i].p.classList.add('isNear');
      }
    }

    if (matchMedia('(hover:hover)').matches){
      map.addEventListener('mousemove', (e)=> setProximity(e.clientX, e.clientY));
      map.addEventListener('mouseleave', ()=> pins.forEach(p => p.classList.remove('isNear','isClosest')));
    } else {
      map.addEventListener('touchstart', (e)=>{
        const t = e.touches && e.touches[0];
        if (!t) return;
        setProximity(t.clientX, t.clientY);
        clearTimeout(map._clearT);
        map._clearT = setTimeout(()=> pins.forEach(p => p.classList.remove('isNear','isClosest')), 1800);
      }, { passive:true });
    }

    // Pins -> modal (disabled while picking)
    pins.forEach(pin=>{
      pin.addEventListener('click', (e)=>{
        e.stopPropagation();
        if (picking) return;
        openFromPin(pin);
      });
    });

    // ===== Pin Picker Tool =====
    function updatePickerUI(){
      pickerBtn.textContent = `Pin Picker: ${picking ? 'On' : 'Off'}`;
      modeBtn.disabled = !picking;
      modeBtn.textContent = `Mode: ${pickerMode === 'mobile' ? 'Mobile' : 'Desktop'}`;
      if (!picking) readout.classList.remove('show');
    }
    updatePickerUI();

    pickerBtn.addEventListener('click', ()=>{
      picking = !picking;
      showToast(picking ? 'Pin Picker On' : 'Pin Picker Off');
      updatePickerUI();
    });

    modeBtn.addEventListener('click', ()=>{
      pickerMode = (pickerMode === 'mobile') ? 'desktop' : 'mobile';
      showToast(`Mode: ${pickerMode}`);
      updatePickerUI();
    });

    function percentsFromEvent(e){
      const r = map.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width * 100);
      const y = ((e.clientY - r.top) / r.height * 100);
      return { x, y };
    }

    map.addEventListener('mousemove', (e)=>{
      if (!picking) return;
      const { x, y } = percentsFromEvent(e);
      readout.textContent = `${x.toFixed(1)}% , ${y.toFixed(1)}%`;
      readout.classList.add('show');
    });

    map.addEventListener('mouseleave', ()=>{
      if (!picking) return;
      readout.classList.remove('show');
    });

    // Click map -> copy the right snippet for the selected mode
    map.addEventListener('click', async (e)=>{
      if (!picking) return;
      const { x, y } = percentsFromEvent(e);
      const left = x.toFixed(1);
      const top  = y.toFixed(1);

      const snippet = (pickerMode === 'mobile')
        ? `data-m-left="${left}" data-m-top="${top}"`
        : `data-d-left="${left}" data-d-top="${top}"`;

      try{
        await navigator.clipboard.writeText(snippet);
        showToast(`Copied: ${snippet}`);
      }catch{
        showToast(`Use: ${snippet}`);
      }
    });
  </script>
</body>
</html>
