<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central Business Intelligence</title>
  <meta name="description" content="Education map with interactive pins and a logo-first modal." />

  <style>
    :root{
      --bg:#ffffff;
      --text:#0b0b0f;
      --muted: rgba(11,11,15,.62);
      --ease: cubic-bezier(.22,.61,.36,1);
      --hair: rgba(11,11,15,.06);
      --mapAR: 21 / 9; /* overwritten by JS to match the actual image ratio */
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overflow-x:hidden;
    }

    /* ======= Minimal top bar ======= */
    .nav{
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--hair);
    }
    .navInner{
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .dot{
      width:10px; height:10px;
      border-radius:999px;
      background: rgba(11,11,15,.85);
      display:inline-block;
    }

    /* ======= HERO ======= */
    .hero{
      padding: 64px 0 34px;
      background:
        radial-gradient(1100px 520px at 50% -10%, rgba(11,11,15,.06), transparent 58%),
        radial-gradient(900px 420px at 10% 10%, rgba(11,11,15,.03), transparent 55%),
        #fff;
    }
    .heroCopy{
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 18px 22px;
    }
    .eyebrow{
      margin:0 0 10px;
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(11,11,15,.55);
    }
    h1{
      margin:0;
      font-size: clamp(40px, 6vw, 84px);
      letter-spacing: -0.04em;
      line-height: 0.98;
    }
    .sub{
      margin: 14px 0 0;
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted);
      max-width: 74ch;
    }

    /* ======= FULL BLEED MAP ======= */
    .bleed{
      width: 100vw;
      margin-left: 50%;
      transform: translateX(-50%);
      padding: 0;
    }

    .map{
      position: relative;
      width: 100%;
      aspect-ratio: var(--mapAR);
      background:#fff;
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      overflow:hidden;
      touch-action: manipulation;
      transform: translateZ(0);
    }

    /* On mobile: keep the SAME aspect ratio (no letterboxing drift),
       but ensure it still feels like a hero via min-height. */
    @media (max-width: 860px){
      .hero{ padding-top: 46px; }
      .map{ min-height: 420px; } /* Apple-like “hero presence” */
    }

    /* Map image (we keep it as <img> so we can read naturalWidth/Height precisely) */
    .mapImg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: contain;     /* safe */
      object-position: center;
      display:block;
      pointer-events:none;
      user-select:none;
    }

    /* Layer that exactly matches the rendered image rectangle */
    .pinLayer{
      position:absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events:none;
    }

    /* ======= PINS ======= */
    .pin{
      position:absolute;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: rgba(11,11,15,.92);
      border: 2px solid rgba(255,255,255,.98);
      cursor:pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,.18);
      outline:none;
      z-index: 2;

      /* Optional micro-adjust per pin (defaults 0) */
      --dx: 0px;
      --dy: 0px;

      /* Proximity scaling */
      --scale: 1;
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--scale));
      transition: transform .18s var(--ease), box-shadow .18s var(--ease);
      pointer-events:auto;
    }

    /* Bigger invisible hit area */
    .pin::before{
      content:"";
      position:absolute;
      inset:-18px;
      border-radius:999px;
    }

    .pin::after{
      content:"";
      position:absolute;
      inset: -10px;
      border-radius: 999px;
      border: 1px solid rgba(11,11,15,.18);
      transform: scale(.55);
      opacity:0;
      animation: pulse 2.2s var(--ease) infinite;
      pointer-events:none;
    }

    /* tiny stagger */
    .pin[data-i="2"]::after{ animation-delay: .25s; }
    .pin[data-i="3"]::after{ animation-delay: .5s; }
    .pin[data-i="4"]::after{ animation-delay: .75s; }
    .pin[data-i="5"]::after{ animation-delay: 1s; }

    @keyframes pulse{
      0%{ transform: scale(.55); opacity:0; }
      18%{ opacity:.85; }
      55%{ opacity:.25; }
      100%{ transform: scale(1.65); opacity:0; }
    }

    .pin.isNear{
      --scale: 1.55;
      z-index: 10;
      box-shadow: 0 14px 34px rgba(0,0,0,.24);
    }
    .pin.isClosest{
      --scale: 1.95;
      z-index: 20;
      box-shadow: 0 18px 44px rgba(0,0,0,.28);
    }

    /* ======= MODAL (logo-first) ======= */
    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.42);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 60;
    }
    .modalBack.isOpen{ display:flex; }

    .modal{
      width: min(900px, 100%);
      border-radius: 30px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.20);
      box-shadow: 0 40px 140px rgba(0,0,0,.34);
      overflow:hidden;
      transform: translateY(10px);
      opacity: 0;
      transition: transform .22s var(--ease), opacity .22s var(--ease);
      backdrop-filter: blur(18px);
    }
    .modalBack.isOpen .modal{ transform: translateY(0); opacity: 1; }

    .modalTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid rgba(11,11,15,.10);
    }
    .modalTop strong{
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(11,11,15,.55);
    }
    .close{
      border: 0;
      background: rgba(11,11,15,.06);
      border-radius: 999px;
      width: 42px;
      height: 42px;
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .18s var(--ease), background .18s var(--ease);
    }
    .close:hover{ background: rgba(11,11,15,.08); }
    .close:active{ transform: scale(.98); }

    .modalBody{
      padding: 32px 32px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .logoHero{
      width: 100%;
      height: 300px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg, rgba(11,11,15,.04), rgba(11,11,15,.01));
      border-radius: 26px;
    }
    .logoHero img{
      max-width: 620px;
      max-height: 210px;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0;
      transform: scale(.96);
      transition: opacity .35s ease, transform .35s ease;
    }
    .modalBack.isOpen .logoHero img{
      opacity: 1;
      transform: scale(1);
    }

    .meta{
      text-align:center;
      margin-top: 2px;
    }
    .meta h2{
      margin:0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .meta p{
      margin: 8px 0 0;
      color: rgba(11,11,15,.58);
      font-size: 14px;
      line-height: 1.45;
      max-width: 72ch;
    }

    .footer{
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 18px 44px;
      color: rgba(11,11,15,.50);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="nav">
    <div class="navInner">
      <div class="brand"><span class="dot"></span> Central Business Intelligence</div>
    </div>
  </div>

  <main class="hero">
    <section class="heroCopy">
      <p class="eyebrow">Education Map</p>
      <h1>Places that shaped my path.</h1>
      <p class="sub">Tap a pin to open details.</p>
    </section>

    <section class="bleed">
      <div class="map" id="map" aria-label="World map with location pins">
        <img class="mapImg" id="mapImg" src="assets/banner-map.png" alt="" />
        <div class="pinLayer" id="pinLayer">
          <!-- Your exact % values (relative to the IMAGE bounds) -->
          <button class="pin" data-i="1"
            data-label="California"
            data-logo="assets/logos/UCR.png"
            data-caption="UCR School of Business • A. Gary Anderson Graduate School of Management"
            style="left:36.4%; top:30.4%"></button>

          <button class="pin" data-i="2"
            data-label="Milan"
            data-logo="assets/logos/Bocconi.png"
            data-caption="SDA Bocconi School of Management"
            style="left:49.6%; top:28.1%"></button>

          <button class="pin" data-i="3"
            data-label="Durham"
            data-logo="assets/logos/Duke.png"
            data-caption="Duke University"
            style="left:40.1%; top:29.5%"></button>

          <button class="pin" data-i="4"
            data-label="Cambridge"
            data-logo="assets/logos/HBR.png"
            data-caption="Harvard Business Review"
            style="left:40.9%; top:27.9%"></button>

          <button class="pin" data-i="5"
            data-label="Hong Kong"
            data-logo="assets/logos/Hong-Kong.png"
            data-caption="The Hong Kong University of Science and Technology"
            style="left:59.8%; top:32.8%"></button>

          <button class="pin" data-i="2"
            data-label="New York City"
            data-logo="assets/logos/NYU.png"
            data-caption="NYU Tandon School of Engineering"
            style="left:40.7%; top:28.1%"></button>

          <button class="pin" data-i="3"
            data-label="New Haven"
            data-logo="assets/logos/Yale.png"
            data-caption="Yale University"
            style="left:41.3%; top:28.1%"></button>
        </div>
      </div>
    </section>

    <div class="footer">Seamless white. Full-bleed hero.</div>
  </main>

  <!-- Modal -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true" aria-label="Location details">
    <div class="modal">
      <div class="modalTop">
        <strong>Details</strong>
        <button class="close" id="closeBtn" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(11,11,15,.75)" stroke-width="2.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <div class="modalBody">
        <div class="logoHero">
          <img id="modalLogo" src="" alt="">
        </div>
        <div class="meta">
          <h2 id="modalTitle"></h2>
          <p id="modalCaption"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const map = document.getElementById('map');
    const img = document.getElementById('mapImg');
    const pinLayer = document.getElementById('pinLayer');
    const pins = Array.from(document.querySelectorAll('.pin'));

    const modalBack = document.getElementById('modalBack');
    const modalLogo = document.getElementById('modalLogo');
    const modalTitle = document.getElementById('modalTitle');
    const modalCaption = document.getElementById('modalCaption');
    const closeBtn = document.getElementById('closeBtn');

    function setMapAspectRatioToImage(){
      const iw = img.naturalWidth || 0;
      const ih = img.naturalHeight || 0;
      if (!iw || !ih) return;
      // Set CSS variable to "w / h" form
      map.style.setProperty('--mapAR', `${iw} / ${ih}`);
    }

    // Size the pinLayer to match the contained image rect (pixel-perfect)
    function syncPinLayerToContainedImage(){
      const cw = map.clientWidth;
      const ch = map.clientHeight;

      const iw = img.naturalWidth || cw;
      const ih = img.naturalHeight || ch;

      const imageAspect = iw / ih;
      const containerAspect = cw / ch;

      let w, h;
      if (imageAspect > containerAspect){
        w = cw;
        h = cw / imageAspect;
      } else {
        h = ch;
        w = ch * imageAspect;
      }

      const left = (cw - w) / 2;
      const top  = (ch - h) / 2;

      // keep sub-pixel precision
      pinLayer.style.left = left.toFixed(3) + 'px';
      pinLayer.style.top = top.toFixed(3) + 'px';
      pinLayer.style.width = w.toFixed(3) + 'px';
      pinLayer.style.height = h.toFixed(3) + 'px';
    }

    function rafSync(){
      requestAnimationFrame(()=>{
        setMapAspectRatioToImage();
        syncPinLayerToContainedImage();
      });
    }

    img.addEventListener('load', rafSync);
    window.addEventListener('resize', rafSync);
    if (img.complete) rafSync();

    function openFromPin(pin){
      modalTitle.textContent = pin.dataset.label || 'Location';
      modalCaption.textContent = pin.dataset.caption || '';
      modalLogo.src = pin.dataset.logo || '';
      modalLogo.alt = pin.dataset.label || 'Logo';
      modalBack.classList.add('isOpen');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(){
      modalBack.classList.remove('isOpen');
      document.body.style.overflow = '';
      modalLogo.src = '';
    }

    closeBtn.addEventListener('click', closeModal);
    modalBack.addEventListener('click', (e)=>{ if (e.target === modalBack) closeModal(); });
    window.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeModal(); });

    // Proximity “alternating”
    function setProximity(clientX, clientY){
      pins.forEach(p => p.classList.remove('isNear','isClosest'));

      const dists = pins.map(p=>{
        const r = p.getBoundingClientRect();
        const cx = r.left + r.width/2;
        const cy = r.top + r.height/2;
        return { p, d: Math.hypot(clientX - cx, clientY - cy) };
      }).sort((a,b)=>a.d-b.d);

      const nearRadius = 56;
      const closestRadius = 34;

      if (!dists[0] || dists[0].d > nearRadius) return;

      if (dists[0].d <= closestRadius) dists[0].p.classList.add('isClosest');
      else dists[0].p.classList.add('isNear');

      for (let i=1; i<Math.min(dists.length, 5); i++){
        if (dists[i].d <= nearRadius) dists[i].p.classList.add('isNear');
      }
    }

    if (matchMedia('(hover:hover)').matches){
      map.addEventListener('mousemove', (e)=> setProximity(e.clientX, e.clientY));
      map.addEventListener('mouseleave', ()=> pins.forEach(p => p.classList.remove('isNear','isClosest')));
    } else {
      map.addEventListener('touchstart', (e)=>{
        const t = e.touches && e.touches[0];
        if (!t) return;
        setProximity(t.clientX, t.clientY);
        clearTimeout(map._clearT);
        map._clearT = setTimeout(()=>{
          pins.forEach(p => p.classList.remove('isNear','isClosest'));
        }, 1800);
      }, { passive:true });
    }

    pins.forEach(pin=>{
      pin.addEventListener('click', (e)=>{
        e.stopPropagation();
        openFromPin(pin);
      });
    });
  </script>
</body>
</html>
