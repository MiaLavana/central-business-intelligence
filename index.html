<header class="hero">
  <div class="heroInner">
    <div class="heroCopy">
      <p class="eyebrow">Education Map</p>
      <h1>Places that shaped my path.</h1>
      <p class="sub">
        Tap a pin to open details. Clean, light, and minimal — built for mobile and desktop.
      </p>

      <div class="actions">
        <button class="btn" id="togglePick">Pin Picker: Off</button>
        <span class="hint" id="pickHint">Turn on, then click the map to copy %.</span>
      </div>
    </div>

    <!-- Map canvas -->
    <div class="mapCard">
      <div class="map" id="map" aria-label="World map with location pins">
        <!-- Pins (starter positions are APPROX placeholders; use Pin Picker to set exact values on your map) -->
        <button class="pin" data-label="California" style="left:18.7%; top:48.8%"></button>
        <button class="pin" data-label="NYC" style="left:24.4%; top:42.0%"></button>

        <button class="pin" data-label="Italy" style="left:55.8%; top:40.7%"></button>
        <button class="pin" data-label="Hong Kong" style="left:78.8%; top:50.0%"></button>

        <button class="pin" data-label="Cambridge (Harvard)" style="left:24.2%; top:41.6%"></button>
        <button class="pin" data-label="Yale" style="left:24.0%; top:42.1%"></button>
        <button class="pin" data-label="Duke" style="left:23.0%; top:46.0%"></button>
        <button class="pin" data-label="Johns Hopkins" style="left:23.6%; top:44.5%"></button>

        <!-- readout bubble -->
        <div class="readout" id="readout" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <!-- Modal (optional) -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true" aria-label="Location details">
    <div class="modal">
      <div class="modalTop">
        <strong id="modalTitle">Location</strong>
        <button class="close" id="closeBtn" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(11,11,15,.75)" stroke-width="2.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="modalBody">
        <div class="modalMeta" id="modalCaption">
          Add a photo + caption per pin when you’re ready.
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied</div>
</header>

<style>
  :root{
    --bg:#fff;
    --text:#0b0b0f;
    --muted: rgba(11,11,15,.62);
    --stroke: rgba(11,11,15,.10);
    --glass: rgba(255,255,255,.72);
    --shadow: 0 22px 60px rgba(0,0,0,.12);
    --radius: 28px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* HERO */
  .hero{
    padding: 54px 18px 34px;
    background: radial-gradient(1200px 420px at 50% -10%, rgba(11,11,15,.06), transparent 55%);
  }
  .heroInner{
    max-width: 1160px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
    align-items: start;
  }

  .heroCopy{
    border: 1px solid var(--stroke);
    background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.62));
    box-shadow: 0 14px 40px rgba(0,0,0,.06);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    backdrop-filter: blur(12px);
  }

  .eyebrow{
    margin:0 0 8px;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: rgba(11,11,15,.55);
  }
  .heroCopy h1{
    margin:0;
    font-size: clamp(28px, 3.2vw, 48px);
    letter-spacing: -0.02em;
    line-height: 1.08;
  }
  .sub{
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.45;
    max-width: 68ch;
  }

  .actions{
    display:flex;
    gap: 12px;
    align-items:center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .btn{
    border: 1px solid rgba(11,11,15,.12);
    background: rgba(11,11,15,.04);
    padding: 10px 14px;
    border-radius: 999px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .18s var(--ease), background .18s var(--ease);
  }
  .btn:hover{ background: rgba(11,11,15,.06); }
  .btn:active{ transform: scale(.98); }
  .hint{
    font-size: 13px;
    color: rgba(11,11,15,.58);
  }

  /* MAP CARD */
  .mapCard{
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    background: #fff;
    overflow: hidden;
  }

  .map{
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9; /* desktop */
    background: #fff url("assets/banner-map.png") center / contain no-repeat;
    transform: translateZ(0);
  }

  /* Make it feel Apple on mobile */
  @media (max-width: 820px){
    .map{ aspect-ratio: 4 / 5; }
  }

  /* PINS */
  .pin{
    position:absolute;
    width: 14px; height: 14px;
    border-radius: 999px;
    background: rgba(11,11,15,.92);
    border: 2px solid rgba(255,255,255,.98);
    transform: translate(-50%, -50%);
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,.18);
    outline: none;
  }
  .pin::after{
    content:"";
    position:absolute;
    inset: -10px;
    border-radius: 999px;
    border: 1px solid rgba(11,11,15,.18);
    transform: scale(.55);
    opacity:0;
    animation: pulse 2.2s var(--ease) infinite;
  }
  .pin:hover{ transform: translate(-50%,-50%) scale(1.06); }
  .pin:focus-visible{
    box-shadow: 0 0 0 4px rgba(11,11,15,.14), 0 10px 20px rgba(0,0,0,.18);
  }

  @keyframes pulse{
    0%{ transform: scale(.55); opacity:0; }
    18%{ opacity:.85; }
    55%{ opacity:.25; }
    100%{ transform: scale(1.65); opacity:0; }
  }

  /* Readout / crosshair */
  .readout{
    position:absolute;
    right: 14px;
    bottom: 12px;
    font-size: 12px;
    color: rgba(11,11,15,.62);
    background: rgba(255,255,255,.82);
    border: 1px solid rgba(11,11,15,.10);
    padding: 6px 8px;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    pointer-events:none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .18s var(--ease), transform .18s var(--ease);
  }
  .readout.show{
    opacity: 1;
    transform: translateY(0);
  }

  /* Minimal cool effect: tiny parallax (desktop only) */
  @media (hover:hover){
    .map{
      will-change: transform;
      transition: transform .22s var(--ease);
    }
  }

  /* MODAL */
  .modalBack{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.42);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 18px;
    z-index: 50;
  }
  .modalBack.isOpen{ display:flex; }

  .modal{
    width: min(860px, 100%);
    border-radius: 28px;
    background: rgba(255,255,255,.92);
    border: 1px solid rgba(255,255,255,.20);
    box-shadow: 0 36px 120px rgba(0,0,0,.32);
    overflow:hidden;
    transform: translateY(8px);
    opacity: 0;
    transition: transform .22s var(--ease), opacity .22s var(--ease);
    backdrop-filter: blur(18px);
  }
  .modalBack.isOpen .modal{ transform: translateY(0); opacity: 1; }

  .modalTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid rgba(11,11,15,.10);
  }
  .close{
    border: 0;
    background: rgba(11,11,15,.06);
    border-radius: 999px;
    width: 42px;
    height: 42px;
    display:grid;
    place-items:center;
    cursor:pointer;
    transition: transform .18s var(--ease), background .18s var(--ease);
  }
  .close:hover{ background: rgba(11,11,15,.08); }
  .close:active{ transform: scale(.98); }

  .modalBody{ padding: 14px 16px 18px; }
  .modalMeta{ color: rgba(11,11,15,.68); font-size: 14px; line-height: 1.45; }

  /* Toast */
  .toast{
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    background: rgba(11,11,15,.86);
    color: #fff;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity .18s ease;
    pointer-events:none;
    z-index: 100;
  }
  .toast.show{ opacity: 1; }
</style>

<script>
  const map = document.getElementById('map');
  const readout = document.getElementById('readout');
  const togglePick = document.getElementById('togglePick');
  const pickHint = document.getElementById('pickHint');
  const toast = document.getElementById('toast');

  const modalBack = document.getElementById('modalBack');
  const modalTitle = document.getElementById('modalTitle');
  const modalCaption = document.getElementById('modalCaption');
  const closeBtn = document.getElementById('closeBtn');

  let picking = false;

  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toast.classList.remove('show'), 900);
  }

  function percentsFromEvent(e){
    const r = map.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width * 100);
    const y = ((e.clientY - r.top) / r.height * 100);
    return { x, y };
  }

  // Live readout (always helpful)
  map.addEventListener('mousemove', (e)=>{
    const { x, y } = percentsFromEvent(e);
    readout.textContent = `${x.toFixed(1)}% , ${y.toFixed(1)}%`;
    readout.classList.add('show');
  });
  map.addEventListener('mouseleave', ()=>{
    readout.classList.remove('show');
  });

  // Minimal parallax (desktop only)
  if (matchMedia('(hover:hover)').matches){
    map.addEventListener('mousemove', (e)=>{
      const r = map.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      map.style.transform = `scale(1.008) translate(${px * 6}px, ${py * 6}px)`;
    });
    map.addEventListener('mouseleave', ()=>{
      map.style.transform = '';
    });
  }

  togglePick.addEventListener('click', ()=>{
    picking = !picking;
    togglePick.textContent = `Pin Picker: ${picking ? 'On' : 'Off'}`;
    pickHint.textContent = picking
      ? 'Click the map to copy: style="left:..%; top:..%"'
      : 'Turn on, then click the map to copy %.';
    showToast(picking ? 'Pin Picker On' : 'Pin Picker Off');
  });

  // Click behavior: picker copies % OR pins open modal
  map.addEventListener('click', async (e)=>{
    if (!picking) return; // only pick when enabled
    const { x, y } = percentsFromEvent(e);
    const left = x.toFixed(1);
    const top  = y.toFixed(1);
    const snippet = `style="left:${left}%; top:${top}%"`
    try{
      await navigator.clipboard.writeText(snippet);
      showToast(`Copied: ${snippet}`);
    }catch{
      showToast(`Pin: ${left}% , ${top}%`);
    }
  });

  // Pin click -> modal (minimal)
  document.querySelectorAll('.pin').forEach(pin=>{
    pin.addEventListener('click', (e)=>{
      e.stopPropagation(); // don’t trigger picker click behind it
      if (picking) return; // when picking, ignore modal
      const label = pin.dataset.label || 'Location';
      modalTitle.textContent = label;
      modalCaption.textContent = 'Swap this for an image + caption per pin when ready.';
      modalBack.classList.add('isOpen');
      document.body.style.overflow = 'hidden';
    });
  });

  function closeModal(){
    modalBack.classList.remove('isOpen');
    document.body.style.overflow = '';
  }
  closeBtn.addEventListener('click', closeModal);
  modalBack.addEventListener('click', (e)=>{ if(e.target === modalBack) closeModal(); });
  window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });
</script>
